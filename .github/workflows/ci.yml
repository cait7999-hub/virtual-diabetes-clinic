name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-test-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Training smoke run
        run: MODEL_VERSION=v0.2 python train.py

      - name: Unit tests
        run: MODEL_VERSION=v0.2 pytest tests/test_unit.py -v

      - name: Upload model and metrics
        uses: actions/upload-artifact@v4
        with:
          name: model-and-metrics
          path: models/
          if-no-files-found: error

  docker-smoke:
    needs: lint-test-train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg MODEL_VERSION=v0.2 -t diabetes-api:ci .
      - name: Container smoke test
        run: |
          docker run -d --name ci-test -p 8080:80 diabetes-api:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health && break; sleep 2; done
          MODEL_VERSION=v0.2 python tests/test_api.py
      - name: Logs on failure
        if: failure()
        run: docker logs ci-test || true
