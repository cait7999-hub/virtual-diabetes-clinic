name: Diabetes ML Pipeline

on:
  push:
  pull_request:

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train diabetes models
        run: python train.py

      - name: Upload trained model and metrics
        uses: actions/upload-artifact@v4
        with:
          name: diabetes-model
          path: |
            models/model.joblib
            models/metrics.json
          if-no-files-found: error

      - name: Build Docker image
        run: docker build -t diabetes-api:ci .

      - name: Test API in Docker
        run: |
          docker run -d --name diabetes-test -p 8080:80 diabetes-api:ci

          echo "Waiting for API to start..."

          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/health > /dev/null; then
              echo "API is ready!"
              break
            fi
            sleep 2
          done

          python tests/test_api.py

      - name: Show container logs on failure
        if: failure()
        run: |
          docker logs diabetes-test || true

      - name: Stop test container
        if: always()
        run: |
          docker rm -f diabetes-test || true
