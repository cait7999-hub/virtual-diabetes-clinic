
name: Docker Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Set image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build \
            --build-arg MODEL_VERSION="${GITHUB_REF_NAME}" \
            -t "$IMAGE:${GITHUB_REF_NAME}" .

      - name: Container smoke test
        run: |
          docker run -d --name release-test -p 8080:80 \
            "$IMAGE:${GITHUB_REF_NAME}"

          echo "Waiting for API..."

          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/health > /dev/null; then
              break
            fi
            sleep 2
          done

          MODEL_VERSION="${GITHUB_REF_NAME}" python tests/test_api.py

      - name: Show container logs on failure
        if: failure()
        run: docker logs release-test || true

      - name: Stop test container
        if: always()
        run: docker rm -f release-test || true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        run: |
          docker push "$IMAGE:${GITHUB_REF_NAME}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md \
            --verify-tag
