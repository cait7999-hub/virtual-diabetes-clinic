name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          docker build --build-arg MODEL_VERSION="${GITHUB_REF_NAME}" \
            -t "$IMAGE:${GITHUB_REF_NAME}" .

      - name: Container smoke test
        run: |
          docker run -d --name release-test -p 8080:80 "$IMAGE:${GITHUB_REF_NAME}"
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health && break; sleep 2; done
          MODEL_VERSION="${GITHUB_REF_NAME}" python tests/test_api.py

      - name: Extract metrics from image
        run: docker cp release-test:/app/models/metrics.json metrics.json

      - name: Logs on failure
        if: failure()
        run: docker logs release-test || true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        run: docker push "$IMAGE:${GITHUB_REF_NAME}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Image: \`$IMAGE:${GITHUB_REF_NAME}\`"
            echo
            echo '## Metrics'
            echo '```json'
            cat metrics.json
            echo '```'
            echo
            cat CHANGELOG.md
          } > notes.md
          gh release create "$GITHUB_REF_NAME" metrics.json \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
